<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — BlogAI</title>
  <link rel="stylesheet" href="../static/css/main.css" />
</head>
<body>
  <a class="skip-link" href="#register-form">Skip to sign up</a>
  <div class="clay-blobs" aria-hidden="true">
    <div class="clay-blob clay-blob-1"></div>
    <div class="clay-blob clay-blob-2"></div>
    <div class="clay-blob clay-blob-3"></div>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon" aria-hidden="true">
          <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
        <h2>Create account</h2>
        <p style="color:var(--clay-muted);margin-top:6px;">Start generating blogs in minutes.</p>
      </div>
      <form id="register-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Jane Doe" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password (min 8 characters)</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" placeholder="••••••••" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:6px" id="submit-btn">Create account</button>
      </form>
      <p style="text-align:center;margin-top:24px;font-size:.92rem;">
        Have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../static/js/api.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = '/dashboard';
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;
      if (password !== confirm) { Toast.error('Passwords do not match'); return; }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        await API.register({
          name:     document.getElementById('name').value.trim(),
          email:    document.getElementById('email').value.trim(),
          password,
        });
        Toast.success('Account created. Signing you in…');
        const tokens = await API.login({ email: document.getElementById('email').value.trim(), password });
        Auth.save(tokens);
        setTimeout(() => window.location.href = '/dashboard', 700);
      } catch (err) {
        Toast.error(err.message);
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>

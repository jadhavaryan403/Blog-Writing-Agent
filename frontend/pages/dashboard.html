<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — BlogAI</title>
  <link rel="stylesheet" href="../static/css/main.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="clay-blobs" aria-hidden="true">
    <div class="clay-blob clay-blob-1"></div>
    <div class="clay-blob clay-blob-2"></div>
    <div class="clay-blob clay-blob-3"></div>
  </div>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="masthead-brand" href="/">BlogAI</a>
      <nav class="masthead-nav" aria-label="Primary">
        <a class="nav-item active" href="/dashboard">Dashboard</a>
        <a class="nav-item" href="/create">New blog</a>
        <a class="nav-item" href="/settings">Settings</a>
      </nav>
      <div class="masthead-user" id="sidebar-user">
        <span class="user-chip"><span class="avatar" id="user-avatar">·</span><span><span class="user-name">—</span><span class="user-email">—</span></span></span>
        <a class="link-logout" href="#" onclick="logout();return false;">Log out</a>
      </div>
    </div>
  </header>

  <main class="main-content" id="main">
    <div class="container">
      <section class="hero">
        <div class="hero-card" style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;">
          <div>
            <p class="eyebrow">Your blogs</p>
            <h1>Dashboard</h1>
          </div>
          <a href="/create" class="btn btn-primary">+ New blog</a>
        </div>
      </section>

      <section>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-orb">B</div><div class="stat-value" id="stat-blogs">—</div><div class="stat-label">Total blogs</div></div>
          <div class="stat-card"><div class="stat-orb" style="background:linear-gradient(135deg,#7DD3FC,#0EA5E9);">T</div><div class="stat-value" id="stat-tokens">—</div><div class="stat-label">Tokens used</div></div>
          <div class="stat-card"><div class="stat-orb" style="background:linear-gradient(135deg,#6EE7B7,#10B981);">C</div><div class="stat-value" id="stat-cost">—</div><div class="stat-label">Total cost</div></div>
          <div class="stat-card"><div class="stat-orb" style="background:linear-gradient(135deg,#F9A8D4,#DB2777);">S</div><div class="stat-value" id="stat-latency">—</div><div class="stat-label">Avg. generation time</div></div>
        </div>
      </section>

      <section>
        <div class="card lift" style="padding:0;overflow:hidden;">
          <div class="card-header" style="padding:28px 28px 0;">
            <h2>Recent blogs</h2>
          </div>
          <div id="blogs-container" style="padding:0 28px 28px;">
            <div style="text-align:center;padding:48px;">
              <span class="spinner" aria-hidden="true"></span>
              <p class="eyebrow" style="margin-top:12px;">Loading…</p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="../static/js/api.js"></script>
  <script>
    guardAuth();
    setActiveNav();

    async function loadDashboard() {
      try {
        const user = await API.me();
        const av = document.getElementById('user-avatar');
        if (av) av.textContent = (user.name || '·')[0].toUpperCase();
        document.querySelectorAll('.user-name').forEach(el => el.textContent = user.name);
        document.querySelectorAll('.user-email').forEach(el => el.textContent = user.email);
      } catch {}

      try {
        const usage = await API.usage();
        document.getElementById('stat-tokens').textContent  = formatTokens(usage.total_tokens);
        document.getElementById('stat-cost').textContent    = formatCost(usage.total_cost);
        document.getElementById('stat-latency').textContent = usage.average_latency
          ? `${usage.average_latency.toFixed(1)}s` : '—';
      } catch {}

      try {
        const data = await API.listBlogs();
        document.getElementById('stat-blogs').textContent = data.total;
        renderBlogs(data.items);
      } catch (err) {
        document.getElementById('blogs-container').innerHTML =
          `<p style="padding:20px;">${err.message}</p>`;
      }
    }

    function renderBlogs(blogs) {
      const el = document.getElementById('blogs-container');
      if (!blogs.length) {
        el.innerHTML = `
          <div class="empty-state">
            <h3 style="margin-bottom:8px;">No blogs yet</h3>
            <p style="margin-bottom:20px;">Create your first AI-generated blog.</p>
            <a href="/create" class="btn btn-primary">Get started</a>
          </div>`;
        return;
      }
      el.innerHTML = `
        <div class="table-wrap" style="box-shadow:none;">
          <table>
            <thead>
              <tr>
                <th>Title / Topic</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${blogs.map((b) => `
                <tr>
                  <td>
                    <div class="blog-title">${escapeRow(b.title) || '(Untitled)'}</div>
                    <div class="blog-topic">${escapeRow(b.topic)}</div>
                  </td>
                  <td>${statusBadge(b.status)}</td>
                  <td style="font-size:.85rem;color:var(--clay-muted);">${formatDate(b.created_at)}</td>
                  <td>
                    <div class="row-actions">
                      ${b.status === 'completed'
                        ? `<a href="/viewer?id=${b.id}" class="btn btn-secondary btn-sm">View</a>`
                        : b.status === 'awaiting_approval'
                          ? `<a href="/approval?blog_id=${b.id}" class="btn btn-primary btn-sm">Review</a>`
                          : b.status === 'running'
                            ? `<a href="/approval?blog_id=${b.id}" class="btn btn-secondary btn-sm">Track</a>`
                            : ''}
                      <button onclick="deleteBlog(${b.id}, this)" class="btn btn-danger btn-sm">Delete</button>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    function escapeRow(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function deleteBlog(id, btn) {
      if (!confirm('Delete this blog? This cannot be undone.')) return;
      btn.disabled = true;
      try {
        await API.deleteBlog(id);
        Toast.success('Blog deleted.');
        loadDashboard();
      } catch (err) {
        Toast.error(err.message);
        btn.disabled = false;
      }
    }

    loadDashboard();
  </script>
</body>
</html>

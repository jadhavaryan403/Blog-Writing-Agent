<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New blog — BlogAI</title>
  <link rel="stylesheet" href="../static/css/main.css" />
</head>
<body>
  <a class="skip-link" href="#create-form">Skip to form</a>
  <div class="clay-blobs" aria-hidden="true">
    <div class="clay-blob clay-blob-1"></div>
    <div class="clay-blob clay-blob-2"></div>
    <div class="clay-blob clay-blob-3"></div>
  </div>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="masthead-brand" href="/">BlogAI</a>
      <nav class="masthead-nav" aria-label="Primary">
        <a class="nav-item" href="/dashboard">Dashboard</a>
        <a class="nav-item active" href="/create">New blog</a>
        <a class="nav-item" href="/settings">Settings</a>
      </nav>
      <div class="masthead-user" id="sidebar-user">
        <span class="user-chip"><span class="avatar" id="user-avatar">·</span><span><span class="user-name">—</span><span class="user-email">—</span></span></span>
        <a class="link-logout" href="#" onclick="logout();return false;">Log out</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="max-width:46rem;">
      <section class="hero">
        <div class="hero-card">
          <p class="eyebrow">Step 1 of 2 — Describe</p>
          <h1>What should we write about?</h1>
        </div>
      </section>

      <section>
        <div class="card lift">
          <form id="create-form">
            <div class="form-group">
              <label for="topic">Blog topic</label>
              <textarea id="topic" rows="2" placeholder="e.g. The future of multi-agent AI systems…" required minlength="3" maxlength="100"></textarea>
              <div class="topic-examples" aria-label="Example topics">
                <span class="example-chip" onclick="setTopic(this)">LangGraph multi-agent systems</span>
                <span class="example-chip" onclick="setTopic(this)">Climate tech innovations 2026</span>
                <span class="example-chip" onclick="setTopic(this)">Rust vs Go for backend services</span>
              </div>
            </div>

            <hr class="divider-soft" />

            <details style="margin-bottom:20px">
              <summary>Writing preferences (optional — defaults come from Settings)</summary>
              <div class="pref-row" style="margin-top:12px">
                <div class="form-group" style="margin-bottom:0">
                  <label for="tone">Tone</label>
                  <select id="tone">
                    <option value="">Use default</option>
                    <option value="professional">Professional</option>
                    <option value="conversational">Conversational</option>
                    <option value="technical">Technical</option>
                    <option value="casual">Casual</option>
                    <option value="persuasive">Persuasive</option>
                  </select>
                </div>
                <div class="form-group" style="margin-bottom:0">
                  <label for="style">Style</label>
                  <select id="style">
                    <option value="">Use default</option>
                    <option value="informative">Informative</option>
                    <option value="tutorial">Tutorial / How-To</option>
                    <option value="opinion">Opinion Piece</option>
                    <option value="listicle">Listicle</option>
                    <option value="deep-dive">Deep Dive</option>
                    <option value="news">News / Journalistic</option>
                  </select>
                </div>
                <div class="form-group" style="margin-bottom:0">
                  <label for="depth">Technical depth</label>
                  <select id="depth">
                    <option value="">Use default</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                    <option value="expert">Expert</option>
                  </select>
                </div>
                <div class="form-group" style="margin-bottom:0">
                  <label for="language">Language</label>
                  <select id="language">
                    <option value="">Use default</option>
                    <option value="English">English</option>
                    <option value="Spanish">Spanish</option>
                    <option value="French">French</option>
                    <option value="German">German</option>
                    <option value="Portuguese">Portuguese</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Arabic">Arabic</option>
                    <option value="Korean">Korean</option>
                  </select>
                </div>
                <div class="form-group" style="margin-top:4px;grid-column:1/-1">
                  <label for="word-count">Target length <span id="wc-badge" class="wc-badge" style="margin-left:10px;vertical-align:middle">2800 words</span></label>
                  <div class="wc-track">
                    <input type="range" id="word-count" min="500" max="5000" step="100" value="2800" oninput="onWcChange(this.value)" />
                    <div class="wc-labels">
                      <span class="eyebrow">500</span>
                      <span class="eyebrow">5000</span>
                    </div>
                  </div>
                </div>
              </div>
            </details>

            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center" id="submit-btn">Generate outline</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="../static/js/api.js"></script>
  <script>
    guardAuth();
    setActiveNav();
    renderSidebarUser();

    function setTopic(chip) {
      document.getElementById('topic').value = chip.textContent.trim();
      document.getElementById('topic').focus();
    }

    function onWcChange(val) {
      document.getElementById('wc-badge').textContent = Number(val).toLocaleString() + ' words';
    }

    document.getElementById('create-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const topic = document.getElementById('topic').value.trim();
      if (!topic) { Toast.error('Please enter a topic.'); return; }
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Generating outline…';
      try {
        const payload = {
          topic,
          tone: document.getElementById('tone').value || null,
          style: document.getElementById('style').value || null,
          technical_depth: document.getElementById('depth').value || null,
          language: document.getElementById('language').value || null,
          word_count: Number(document.getElementById('word-count').value) || null,
        };
        const result = await API.startWorkflow(payload);
        Toast.success('Outline ready. Opening review…');
        setTimeout(() => {
          window.location.href = `/approval?job_id=${result.job_id}&blog_id=${result.blog_id}`;
        }, 800);
      } catch (err) {
        const detail = err && err.message ? err.message : String(err);
        Toast.error(detail);
        btn.disabled = false;
        btn.textContent = 'Generate outline';
      }
    });
  </script>
</body>
</html>

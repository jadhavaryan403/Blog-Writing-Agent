<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — BlogAI</title>
  <link rel="stylesheet" href="../static/css/main.css" />
</head>
<body>
  <a class="skip-link" href="#prefs-form">Skip to settings</a>
  <div class="clay-blobs" aria-hidden="true">
    <div class="clay-blob clay-blob-1"></div>
    <div class="clay-blob clay-blob-2"></div>
    <div class="clay-blob clay-blob-3"></div>
  </div>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="masthead-brand" href="/">BlogAI</a>
      <nav class="masthead-nav" aria-label="Primary">
        <a class="nav-item" href="/dashboard">Dashboard</a>
        <a class="nav-item" href="/create">New blog</a>
        <a class="nav-item active" href="/settings">Settings</a>
      </nav>
      <div class="masthead-user" id="sidebar-user">
        <span class="user-chip"><span class="avatar" id="user-avatar">·</span><span><span class="user-name">—</span><span class="user-email">—</span></span></span>
        <a class="link-logout" href="#" onclick="logout();return false;">Log out</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="max-width:48rem;">
      <section class="hero">
        <div class="hero-card">
          <p class="eyebrow">Defaults for every blog</p>
          <h1>Writing settings</h1>
        </div>
      </section>

      <section>
        <div id="pref-summary-wrap" style="display:none">
          <div class="pref-summary" id="pref-summary"></div>
        </div>

        <div class="card lift" id="prefs-card">
          <div id="prefs-loading" style="text-align:center;padding:36px;">
            <span class="spinner" style="width:28px;height:28px;" aria-hidden="true"></span>
            <p class="eyebrow" style="margin-top:12px;">Loading…</p>
          </div>

          <form id="prefs-form" onsubmit="savePrefs(event)">
            <div class="settings-grid">
              <div class="form-group">
                <label for="tone">Tone</label>
                <select id="tone">
                  <option value="professional">Professional</option>
                  <option value="conversational">Conversational</option>
                  <option value="technical">Technical</option>
                  <option value="casual">Casual</option>
                  <option value="persuasive">Persuasive</option>
                  <option value="academic">Academic</option>
                </select>
              </div>
              <div class="form-group">
                <label for="style">Style</label>
                <select id="style">
                  <option value="informative">Informative</option>
                  <option value="tutorial">Tutorial / How-To</option>
                  <option value="opinion">Opinion Piece</option>
                  <option value="listicle">Listicle</option>
                  <option value="deep-dive">Deep Dive</option>
                  <option value="news">News / Journalistic</option>
                </select>
              </div>
              <div class="form-group">
                <label for="depth">Technical depth</label>
                <select id="depth">
                  <option value="beginner">Beginner</option>
                  <option value="intermediate">Intermediate</option>
                  <option value="advanced">Advanced</option>
                  <option value="expert">Expert</option>
                </select>
              </div>
              <div class="form-group">
                <label for="language">Language</label>
                <select id="language">
                  <option value="English">English</option>
                  <option value="Spanish">Spanish</option>
                  <option value="French">French</option>
                  <option value="German">German</option>
                  <option value="Portuguese">Portuguese</option>
                  <option value="Japanese">Japanese</option>
                  <option value="Hindi">Hindi</option>
                  <option value="Arabic">Arabic</option>
                  <option value="Korean">Korean</option>
                </select>
              </div>
            </div>

            <div class="form-group" style="margin-top:4px">
              <label for="word-count">Default length <span id="wc-badge" class="wc-badge" style="margin-left:10px;vertical-align:middle">1,500 words</span></label>
              <div class="wc-track">
                <input type="range" id="word-count" min="500" max="5000" step="100" oninput="onWcChange(this.value)" />
                <div class="wc-labels">
                  <span class="eyebrow">500</span>
                  <span class="eyebrow">5000</span>
                </div>
              </div>
            </div>

            <hr class="divider-soft" />

            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
              <button type="button" class="btn btn-secondary" onclick="resetToDefaults()">Reset</button>
              <div id="save-status" class="eyebrow" style="margin-left:auto"></div>
            </div>

            <div class="updated-line" id="updated-line" style="display:none">
              <span class="updated-dot" aria-hidden="true"></span>
              Saved&nbsp;<span id="updated-at"></span>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="../static/js/api.js"></script>
  <script>
    guardAuth();
    setActiveNav();
    renderSidebarUser();

    const DEFAULTS = {
      preferred_tone:       'professional',
      preferred_style:      'informative',
      technical_depth:      'intermediate',
      preferred_language:   'English',
      preferred_word_count: 1500,
    };

    function onWcChange(val) {
      document.getElementById('wc-badge').textContent = Number(val).toLocaleString() + ' words';
    }

    const LABELS = {
      preferred_tone:       { label: 'Tone',     fn: v => String(v).charAt(0).toUpperCase() + String(v).slice(1) },
      preferred_style:      { label: 'Style',    fn: v => String(v).charAt(0).toUpperCase() + String(v).slice(1) },
      technical_depth:      { label: 'Depth',    fn: v => String(v).charAt(0).toUpperCase() + String(v).slice(1) },
      preferred_language:   { label: 'Language', fn: v => v },
      preferred_word_count: { label: 'Words',    fn: v => Number(v).toLocaleString() },
    };

    function renderSummary(prefs) {
      const wrap    = document.getElementById('pref-summary-wrap');
      const summary = document.getElementById('pref-summary');
      summary.innerHTML = Object.entries(LABELS).map(([key, meta]) => {
        const val = prefs[key] ?? DEFAULTS[key];
        return `<div class="pref-chip"><span class="pref-chip-key">${meta.label}</span><span class="pref-chip-val">${meta.fn(val)}</span></div>`;
      }).join('');
      wrap.style.display = 'block';
    }

    function populateForm(p) {
      p = p || {};
      const rawDepth = String(p.technical_depth || 'intermediate').split(' ')[0].toLowerCase();
      document.getElementById('tone').value     = p.preferred_tone    || DEFAULTS.preferred_tone;
      document.getElementById('depth').value    = rawDepth;
      document.getElementById('language').value = p.preferred_language || DEFAULTS.preferred_language;
      const styleEl  = document.getElementById('style');
      const styleVal = String(p.preferred_style || DEFAULTS.preferred_style).toLowerCase();
      for (const opt of styleEl.options) {
        if (opt.value.toLowerCase() === styleVal) { styleEl.value = opt.value; break; }
      }
      const wc = p.preferred_word_count || DEFAULTS.preferred_word_count;
      document.getElementById('word-count').value = wc;
      onWcChange(wc);
      if (p.updated_at) {
        document.getElementById('updated-line').style.display = 'flex';
        document.getElementById('updated-at').textContent = formatDate(p.updated_at);
      }
    }

    async function loadPrefs() {
      // Show the form immediately with defaults so the page can never
      // get stuck on "Loading…" if the network is slow or the backend
      // is unreachable. Server values upgrade the form when they arrive.
      document.getElementById('prefs-loading').style.display = 'none';
      document.getElementById('prefs-form').style.display    = 'block';
      populateForm(DEFAULTS);
      renderSummary(DEFAULTS);

      try {
        const p = await API.getPrefs();
        if (p && typeof p === 'object') {
          populateForm(p);
          renderSummary(p);
        }
      } catch (err) {
        document.getElementById('save-status').textContent = 'Could not load saved settings';
        Toast.error('Failed to load settings');
      }
    }

    const SAVE_HTML = 'Save';
    async function savePrefs(e) {
      e.preventDefault();
      const btn      = document.getElementById('save-btn');
      const statusEl = document.getElementById('save-status');
      btn.disabled   = true;
      btn.textContent = 'Saving…';
      statusEl.textContent = '';
      const payload = {
        preferred_tone:       document.getElementById('tone').value,
        preferred_style:      document.getElementById('style').value,
        technical_depth:      document.getElementById('depth').value,
        preferred_language:   document.getElementById('language').value,
        preferred_word_count: parseInt(document.getElementById('word-count').value, 10),
      };
      try {
        const updated = await API.updatePrefs(payload);
        populateForm(updated);
        renderSummary(updated);
        const card = document.getElementById('prefs-card');
        card.classList.add('saved-flash');
        setTimeout(() => card.classList.remove('saved-flash'), 1200);
        statusEl.textContent = 'Saved';
        Toast.success('Settings saved.');
        setTimeout(() => { statusEl.textContent = ''; }, 4000);
      } catch (err) {
        statusEl.textContent = 'Save failed';
        Toast.error('Save failed: ' + err.message);
      } finally {
        btn.disabled  = false;
        btn.textContent = SAVE_HTML;
      }
    }

    function resetToDefaults() {
      populateForm(DEFAULTS);
      document.getElementById('save-status').textContent = 'Defaults loaded — press Save.';
    }

    loadPrefs();
  </script>
</body>
</html>

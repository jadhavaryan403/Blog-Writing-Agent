<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — BlogAI</title>
  <link rel="stylesheet" href="../static/css/main.css" />
</head>
<body>
  <a class="skip-link" href="#login-form">Skip to sign in</a>
  <div class="clay-blobs" aria-hidden="true">
    <div class="clay-blob clay-blob-1"></div>
    <div class="clay-blob clay-blob-2"></div>
    <div class="clay-blob clay-blob-3"></div>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon" aria-hidden="true">
          <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
        <h2>Welcome back</h2>
        <p style="color:var(--clay-muted);margin-top:6px;">Sign in to continue.</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:6px" id="submit-btn">Sign in</button>
      </form>
      <p style="text-align:center;margin-top:24px;font-size:.92rem;">
        No account? <a href="/register">Create one</a>
      </p>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../static/js/api.js"></script>
  <script>
    if (Auth.isLoggedIn()) window.location.href = '/dashboard';
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const tokens = await API.login({
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        });
        Auth.save(tokens);
        Toast.success('Welcome back.');
        setTimeout(() => window.location.href = '/dashboard', 500);
      } catch (err) {
        Toast.error(err.message);
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>

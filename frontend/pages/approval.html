<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review outline — BlogAI</title>
  <link rel="stylesheet" href="../static/css/main.css" />
</head>
<body>
  <a class="skip-link" href="#plan-editor">Skip to outline</a>
  <div class="clay-blobs" aria-hidden="true">
    <div class="clay-blob clay-blob-1"></div>
    <div class="clay-blob clay-blob-2"></div>
    <div class="clay-blob clay-blob-3"></div>
  </div>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="masthead-brand" href="/">BlogAI</a>
      <nav class="masthead-nav" aria-label="Primary">
        <a class="nav-item" href="/dashboard">Dashboard</a>
        <a class="nav-item" href="/create">New blog</a>
        <a class="nav-item" href="/settings">Settings</a>
      </nav>
      <div class="masthead-user" id="sidebar-user">
        <span class="user-chip"><span class="avatar" id="user-avatar">·</span><span><span class="user-name">—</span><span class="user-email">—</span></span></span>
        <a class="link-logout" href="#" onclick="logout();return false;">Log out</a>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="max-width:52rem;">
      <section class="hero">
        <div class="hero-card">
          <p class="eyebrow">Step 2 of 2 — Review</p>
          <h1>Review the outline</h1>
          <p class="lead" style="margin-top:8px;">Edit anything, then approve to start writing. <span id="plan-topic"></span></p>
        </div>
      </section>

      <section>
        <div id="loading-state" class="card" style="text-align:center;padding:64px;">
          <span class="spinner" style="width:32px;height:32px;" aria-hidden="true"></span>
          <p class="eyebrow" style="margin-top:16px;">Loading outline…</p>
        </div>

        <div id="plan-editor" style="display:none;">
          <div id="research-banner" class="research-banner" style="display:none;">
            <strong>Web research enabled</strong> — the AI will search the web before writing.
            <div id="research-tasks" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px"></div>
          </div>

          <div class="plan-header">
            <label for="plan-title">Blog title</label>
            <input type="text" class="plan-title-input" id="plan-title" placeholder="Enter blog title…" />
            <div style="display:flex;gap:20px;align-items:end;flex-wrap:wrap">
              <div>
                <label for="word-count">Target word count</label>
                <input type="number" id="word-count" min="200" max="10000" step="100" style="width:150px;" />
              </div>
              <div id="section-count-display" class="eyebrow"></div>
            </div>
          </div>

          <div style="margin-bottom:16px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin:20px 4px 12px;flex-wrap:wrap;gap:8px;">
              <h2>Sections</h2>
              <button class="btn btn-secondary btn-sm" onclick="addSection()">+ Add section</button>
            </div>
            <div id="sections-list"></div>
          </div>
        </div>

        <div class="action-bar" id="action-bar" style="display:none;">
          <a href="/dashboard" class="btn btn-ghost">Cancel</a>
          <button class="btn btn-primary" id="approve-btn" onclick="submitApproval()">Approve &amp; write</button>
        </div>
      </section>
    </div>
  </main>

  <div class="workflow-overlay" id="workflow-overlay" role="status" aria-live="polite">
    <div class="workflow-box">
      <div class="big-spinner" aria-hidden="true"></div>
      <h3 style="margin-bottom:8px;" id="overlay-title">Processing…</h3>
      <p class="eyebrow" id="overlay-status">Starting</p>
      <div style="margin-top:20px;">
        <div class="workflow-steps" id="overlay-steps" style="justify-content:center;flex-wrap:wrap;gap:12px"></div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../static/js/api.js"></script>
  <script>
    guardAuth();
    setActiveNav();
    renderSidebarUser();

    const params  = new URLSearchParams(window.location.search);
    const jobId   = params.get('job_id');
    const blogId  = params.get('blog_id');
    let pollTimer = null;

    if (!jobId) window.location.href = '/dashboard';

    async function loadPlan() {
      try {
        const status = await API.workflowStatus(jobId);
        if (status.status === 'completed' && status.final_blog) {
          window.location.href = `/viewer?id=${status.blog_id}`;
          return;
        }
        if (status.status === 'running') {
          showRunningOverlay(status.current_node);
          startPolling();
          return;
        }
        if (!status.plan) {
          setTimeout(loadPlan, 2000);
          return;
        }
        renderPlan(status.plan, status);
      } catch (err) {
        document.getElementById('loading-state').innerHTML =
          `<p>${err.message}</p>`;
      }
    }

    function renderPlan(plan, status) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('plan-editor').style.display   = 'block';
      document.getElementById('action-bar').style.display    = 'flex';
      document.getElementById('plan-title').value = plan.title || '';
      document.getElementById('word-count').value = plan.estimated_word_count || 1500;
      document.getElementById('plan-topic').textContent = '';

      if (plan.research_required) {
        const tasks = plan.research_tasks
          ? (Array.isArray(plan.research_tasks) ? plan.research_tasks : Object.values(plan.research_tasks))
          : [];
        if (tasks.length) {
          const banner = document.getElementById('research-banner');
          banner.style.display = 'block';
          document.getElementById('research-tasks').innerHTML = tasks.map(t =>
            `<span class="research-task-chip">${escHtml(String(t))}</span>`
          ).join('');
        }
      }
      renderSections(plan.sections || []);
    }

    function renderSections(sections) {
      const list = document.getElementById('sections-list');
      list.innerHTML = '';
      sections.forEach((sec, i) => list.appendChild(buildSectionCard(sec, i)));
      updateSectionCount();
    }

    function buildSectionCard(sec, idx) {
      const div = document.createElement('div');
      div.className  = 'section-card';
      div.dataset.idx = idx;
      div.innerHTML = `
        <div class="section-number">${idx + 1}</div>
        <div class="section-body">
          <input type="text" placeholder="Section title" value="${escHtml(sec.title || '')}"
            oninput="updateSectionCount()" style="width:100%" />
          <textarea placeholder="What this section covers…" style="width:100%">${escHtml(sec.description || '')}</textarea>
          <div class="section-meta">
            <label>Words:</label>
            <input type="number" min="50" max="3000" step="50" value="${sec.word_count || 300}" />
            <button onclick="removeSection(this)" class="btn btn-danger btn-sm" style="margin-left:auto">Remove</button>
          </div>
        </div>`;
      return div;
    }

    function addSection() {
      const list = document.getElementById('sections-list');
      list.appendChild(buildSectionCard({ title: '', description: '', word_count: 300 }, list.children.length));
      updateSectionCount();
    }

    function removeSection(btn) {
      btn.closest('.section-card').remove();
      document.querySelectorAll('.section-card').forEach((card, i) => {
        card.dataset.idx = i;
        card.querySelector('.section-number').textContent = i + 1;
      });
      updateSectionCount();
    }

    function updateSectionCount() {
      const count = document.querySelectorAll('.section-card').length;
      document.getElementById('section-count-display').textContent = `${count} section${count !== 1 ? 's' : ''}`;
    }

    function collectPlan() {
      const sections = [];
      document.querySelectorAll('.section-card').forEach(card => {
        const inputs = card.querySelectorAll('input[type="text"], textarea');
        const wc     = card.querySelector('input[type="number"]');
        sections.push({
          title:       inputs[0]?.value.trim() || '',
          description: inputs[1]?.value.trim() || '',
          word_count:  parseInt(wc?.value || 300),
        });
      });
      return {
        title:               document.getElementById('plan-title').value.trim(),
        sections,
        estimated_word_count: parseInt(document.getElementById('word-count').value || 1500),
      };
    }

    const APPROVE_HTML = 'Approve &amp; write';
    async function submitApproval() {
      const btn = document.getElementById('approve-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';
      const plan = collectPlan();
      if (!plan.title) { Toast.error('Please enter a blog title.'); btn.disabled = false; btn.innerHTML = APPROVE_HTML; return; }
      if (!plan.sections.length) { Toast.error('Add at least one section.'); btn.disabled = false; btn.innerHTML = APPROVE_HTML; return; }
      try {
        await API.editPlan(jobId, plan);
        Toast.success('Plan approved. Writing your blog…');
        showRunningOverlay('researcher');
        startPolling();
      } catch (err) {
        Toast.error(err.message);
        btn.disabled = false;
        btn.innerHTML = APPROVE_HTML;
      }
    }

    const NODE_LABELS = {
      researcher:    'Researching',
      generate:      'Writing',
      image_planner: 'Planning images',
      image_search:  'Finding images',
      stitch_blog:   'Assembling blog',
      persist_state: 'Saving',
      END:           'Done',
    };

    function showRunningOverlay(currentNode) {
      document.getElementById('workflow-overlay').classList.add('visible');
      updateOverlayStatus(currentNode);
    }

    function updateOverlayStatus(node) {
      document.getElementById('overlay-title').textContent  = NODE_LABELS[node] || 'Processing…';
      document.getElementById('overlay-status').textContent = String(node || '…');
    }

    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(async () => {
        try {
          const st = await API.workflowStatus(jobId);
          updateOverlayStatus(st.current_node);
          if (st.status === 'completed') {
            clearInterval(pollTimer);
            Toast.success('Blog ready. Opening…');
            setTimeout(() => window.location.href = `/viewer?id=${st.blog_id}`, 1000);
          }
          if (st.status === 'error') {
            clearInterval(pollTimer);
            document.getElementById('workflow-overlay').classList.remove('visible');
            Toast.error('Something went wrong. Please try again.');
          }
        } catch {}
      }, 3000);
    }

    function escHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadPlan();
  </script>
</body>
</html>
